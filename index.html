function bsAdd(s){const h=$("add_"+s).value;if(!h||!Object.values(CT(s)).some(a=>a.includes(h))){alert("Choose a head from the list.");return}

function bsAmt(s,i,v){const x=BC(s)[i],n=parseFloat(v)||0;if(x.src==="loan"||x.src==="cc"||x.src==="ol")S.set[x.src]=n;else x.amt=n;save()}
function bsNote(s,i,v){BC(s)[i].note=v.trim().slice(0,200);save()}
function bsShow(s,i,v){BC(s)[i].show=!!v;save()}
function bsGen(){S.set.bsc.notes=$("gn").value.slice(0,2000);S.set.bsc.sn=$("gs").checked;save()}
function vSet(){return`<div class="set">${vSet0()}</div>`}
function vSet0(){const s=S.set,tm=TP(),ct=(t,id,l,k)=>`<div class="card"><h2>${t}</h2><label>${l}</label><input id="${id}" value="${esc(s[k].join(", "))}"><p><button class="btn p" onclick="saveCat('${k}','${id}')">Save</button></p></div>`,o=(v,l)=>`<option value="${v}" ${tm===v?"selected":""}>${l}</option>`;
  return(!s.obd||!s.ocd?`<div class="card warn">Opening balance dates are not set yet. Existing amounts are preserved and used as before until you set the dates below.</div>`:"")+
  `<div class="card"><h2>${ic("bank",16)} Opening balances</h2><div class="row">
  <div><label>Opening bank balance (₹)</label><input id="ob" type="number" step="0.01" value="${s.ob}"></div>
  <div><label>Bank balance as of</label><input id="obd" type="date" value="${s.obd||""}"></div>
  <div><label>Opening cash balance (₹)</label><input id="oc" type="number" step="0.01" value="${s.oc}"></div>
  <div><label>Cash balance as of</label><input id="ocd" type="date" value="${s.ocd||""}"></div></div>
  <p class="k">Total opening balance: <b>${fmt((+s.ob||0)+(+s.oc||0))}</b> · Bank as of ${dmy(s.obd)} · Cash as of ${dmy(s.ocd)} · Last updated: ${dmy(s.ou)}</p>
  <p class="k">Opening balances are a starting point only: not income, not expense, and excluded from savings. Transactions dated before an account’s opening date are not counted in that account’s balance.</p>
  <button class="btn p" onclick="saveOB()">${ic("check",14)} Save opening balances</button></div>`+
  ct(ic("plus",16)+" Income categories","ci","Comma-separated","inc")+ct(ic("plus",16)+" Expense categories","ce","Comma-separated (keep “SIP/Shares” to count it as an investment)","exp")+bsCfg()+
  `<div class="card"><h2>${ic("sun",16)} Theme preferences</h2><label>Appearance</label><select onchange="setTheme(this.value)" style="max-width:380px">${o("light","Light Mode")}${o("dark","Dark Blue Mode")}${o("system","System Default")}</select></div>
  <div class="card"><h2>${ic("list",16)} Data backup and restore</h2><p class="k">Data is stored in this browser only. Copy the text below to back it up; paste a backup and press Restore to load it.</p><textarea id="bk" rows="5"></textarea><p><button class="btn" onclick="$('bk').value=JSON.stringify(S);$('bk').select()">Show backup</button> <button class="btn" onclick="restore()">Restore</button></p></div>
  <div class="card"><h2>${ic("sliders",16)} Application preferences</h2><label>Screen to open first</label><select onchange="S.set.home=this.value;save()" style="max-width:380px">${tabs.map(([k,n])=>`<option value="${k}" ${(s.home||"dash")===k?"selected":""}>${n}</option>`).join("")}</select><p><button class="btn" onclick="wipe()">${ic("trash",14)} Erase all data</button></p></div>`}
function saveOB(){const g=i=>$(i).value,ob=parseFloat(g("ob")||"0"),oc=parseFloat(g("oc")||"0"),dt=/^\d{4}-\d{2}-\d{2}$/;
  if(!isFinite(ob)||!isFinite(oc)||Math.abs(ob)>=1e10||Math.abs(oc)>=1e10){alert("Enter valid opening amounts.");return}
  if((g("obd")&&!dt.test(g("obd")))||(g("ocd")&&!dt.test(g("ocd")))){alert("Enter valid dates.");return}
  Object.assign(S.set,{ob,oc,obd:g("obd"),ocd:g("ocd"),ou:TODAY});save();render()}
function saveCat(k,id){const a=$(id).value.split(",").map(s=>s.trim()).filter(Boolean);if(!a.length){alert("Add at least one category.");return}S.set[k]=a;save();render()}
function restore(){try{const p=JSON.parse($("bk").value);if(!Array.isArray(p.tx))throw 0;p.tx=p.tx.filter(t=>t&&t.date&&t.amt>0);S={...S,...p,set:{...S.set,...p.set}};if(!Array.isArray(S.rec))S.rec=[];normTx();ensureBSC();save();render()}catch(e){alert("That backup text is not valid.")}}
function wipe(){if(confirm("Erase all entries, recurring schedules and opening balances?")){S.tx=[];S.rec=[];S.id=1;S.rid=1;S.set.ob=0;S.set.oc=0;S.set.obd="";S.set.ocd="";S.set.ou="";save();render()}}
function seed(){const T=[["11-01","Income","Job","Bank",55000],["11-01","Expense","Netflix","Bank",649],["11-02","Expense","SIP/Shares","Bank",5000],["11-03","Expense","Family","Cash",1500],["11-05","Income","Family","Cash",2000],["11-06","Expense","Party","Cash",1200],["11-08","Expense","Others","Bank",850],["11-10","Expense","Family","Bank",3000],["11-12","Income","Others","Bank",1500],["11-12","Expense","Others","Cash",400],
  ["12-01","Income","Job","Bank",55000],["12-01","Expense","Netflix","Bank",649],["12-02","Expense","SIP/Shares","Bank",5000],["12-04","Expense","Family","Bank",4000],["12-07","Expense","Others","Cash",600],["12-10","Income","Family","Cash",3000],["12-15","Expense","Trip","Bank",8500],["12-20","Expense","Party","Cash",2500],["12-24","Income","Others","Bank",2000],["12-28","Expense","Family","Cash",1800]];
  T.forEach(([d,t,h,m,a])=>S.tx.push({id:S.id++,date:"2026-"+d,type:t,head:h,mode:m,amt:a,note:"Sample",s:1}));S.set.ob=40000;S.set.oc=3000;S.set.obd="2026-11-01";S.set.ocd="2026-11-01";S.set.ou=TODAY;save()}
function dropSample(){if(confirm("Remove the sample entries and reset opening balances to zero?")){S.tx=S.tx.filter(t=>!t.s);S.set.ob=0;S.set.oc=0;S.set.obd="";S.set.ocd="";save();render()}}
// ---------- Welcome popup: shown on every visit (display only; reads and writes no data)
function welcome(){if(!document.body)return;document.body.insertAdjacentHTML("beforeend",'<div id="wc"><div class="wc-card" role="dialog" aria-modal="true"><div class="wc-body"><div class="wc-ic">'+ic("wallet",26)+'</div><h2>Your Personal Finance Dashboard</h2><p class="wc-tag">Simple, organised and clear.</p><p>Manage your income, expenses, savings and financial position — all in one place.</p><button class="btn p wc-go" id="wc-go" onclick="wcClose()">Let’s Begin</button></div></div></div>');
  addEventListener("keydown",e=>{if(e.key==="Escape")wcClose()});$("wc-go").focus({preventScroll:true})}
function wcClose(){const m=$("wc");if(m)m.hidden=true}
ensureBSC();
if(!had)seed();
render();
try{localStorage.removeItem("mf_tour")}catch(e){} // one-time cleanup of an old, unused browser setting; no other data is touched
welcome();
</script></body></html>
