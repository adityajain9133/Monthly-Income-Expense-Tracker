<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Income &amp; Expense Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--tx:#1c2330;--mut:#667085;--line:#e3e6ec;--ac:#2f6fed;--inc:#17814a;--exp:#cf3f2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#98a2b3;--line:#2a313d;--ac:#6b9bff;--inc:#4cc78a;--exp:#ff7b66}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#98a2b3;--line:#2a313d;--ac:#6b9bff;--inc:#4cc78a;--exp:#ff7b66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:6px 0 10px}h2{font-size:15px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:12px;color:var(--mut)}.v{font-size:20px;font-weight:650}
.inc{color:var(--inc)}.exp{color:var(--exp)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;width:100%}
label{font-size:12px;color:var(--mut);display:block}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:3px}.bar i{display:block;height:100%;border-radius:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.x{border:0;background:none;color:var(--exp);cursor:pointer;font-size:16px}
</style></head><body><main>
<h1>💰 Monthly Income &amp; Expense Tracker</h1>
<nav id="nav"></nav><div id="app"></div></main>
<script>
const KEY="mf_tracker_v1";
let S={tx:[],id:1,set:{ob:0,oc:0,loan:0,cc:0,ol:0,inc:["Job","Family","Others"],exp:["Family","Party","Trip","SIP/Shares","Netflix","Others"]}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);S={...S,...p,set:{...S.set,...p.set}}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=iso(new Date());let M=TODAY.slice(0,7),V="dash",AS=TODAY;
const INV="SIP/Shares";
const fmt=n=>"₹"+(+n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const pct=n=>((n||0)*100).toFixed(1)+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prevM=m=>{const [y,mo]=m.split("-").map(Number);return iso(new Date(y,mo-2,1)).slice(0,7)};
const dim=m=>{const [y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()};
const div=(a,b)=>b?a/b:0; // IFERROR(a/b,0)
// Balance: opening + income - expense, split Bank/Cash (Cash Flow Statement H and I columns)
function bal(d,before){let b=+S.set.ob,c=+S.set.oc;for(const t of S.tx){if(before?t.date>=d:t.date>d)continue;const s=t.type==="Income"?1:-1;if(t.mode==="Bank")b+=s*t.amt;else c+=s*t.amt}return{b,c}}
const tot=(m,type,cat,mode)=>S.tx.filter(t=>t.date.startsWith(m)&&t.type===type&&(!cat||t.head===cat)&&(!mode||t.mode===mode)).reduce((a,t)=>a+t.amt,0);
const tabs=[["dash","Dashboard"],["cf","Cash Flow"],["bs","Balance Sheet"],["set","Settings"]];
function go(v){V=v;render()}
function render(){
  document.getElementById("nav").innerHTML=tabs.map(([k,n])=>`<button class="${V===k?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
  document.getElementById("app").innerHTML={dash,cf,bs,set:settings}[V]();
}
const monthPick=()=>`<div class="card"><label>Select month</label><input type="month" value="${M}" onchange="M=this.value||M;render()" style="max-width:200px"></div>`;
function dash(){
  const inc=tot(M,"Income"),exp=tot(M,"Expense"),net=inc-exp,P=prevM(M);
  const pi=tot(P,"Income"),pe=tot(P,"Expense"),pn=pi-pe;
  const last=M===TODAY.slice(0,7)?TODAY:M+"-"+dim(M),cb=bal(last);
  const cmp=(n,a,b)=>`<tr><td>${n}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td>${fmt(a-b)}</td><td>${pct(div(a-b,b))}</td></tr>`;
  const brk=(list,type,total,col)=>list.map(c=>{const a=tot(M,type,c),p=div(a,total);return`<tr><td>${esc(c)}<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:var(--${col})"></i></div></td><td>${fmt(a)}</td><td>${pct(p)}</td></tr>`}).join("")+`<tr><th>Total</th><th>${fmt(total)}</th><th>${pct(total?1:0)}</th></tr>`;
  return monthPick()+`<div class="grid card">
  <div><div class="k">TOTAL INCOME</div><div class="v inc">${fmt(inc)}</div></div>
  <div><div class="k">TOTAL EXPENSES</div><div class="v exp">${fmt(exp)}</div></div>
  <div><div class="k">NET SAVINGS</div><div class="v">${fmt(net)}</div></div>
  <div><div class="k">SAVINGS RATE</div><div class="v">${pct(div(net,inc))}</div></div></div>
  <div class="card sc"><h2>Full-month comparison</h2><table><tr><th>Metric</th><th>Selected</th><th>Previous</th><th>Difference</th><th>Change %</th></tr>${cmp("Income",inc,pi)}${cmp("Expenses",exp,pe)}${cmp("Net Savings",net,pn)}</table></div>
  <div class="two"><div class="card sc"><h2>Income by source</h2><table><tr><th>Source</th><th>Amount</th><th>% of income</th></tr>${brk(S.set.inc,"Income",inc,"inc")}</table></div>
  <div class="card sc"><h2>Expense by category</h2><table><tr><th>Category</th><th>Amount</th><th>% of expense</th></tr>${brk(S.set.exp,"Expense",exp,"exp")}</table></div></div>
  <div class="card"><h2>Cash &amp; bank position (${last})</h2><div class="grid"><div><div class="k">Closing bank</div><div class="v">${fmt(cb.b)}</div></div><div><div class="k">Closing cash</div><div class="v">${fmt(cb.c)}</div></div><div><div class="k">Total available</div><div class="v">${fmt(cb.b+cb.c)}</div></div></div></div>`;
}
function catOpts(type){return(type==="Income"?S.set.inc:S.set.exp).map(c=>`<option>${esc(c)}</option>`).join("")}
function swapCats(){document.getElementById("fh").innerHTML=catOpts(document.getElementById("ft").value)}
function addTx(){
  const g=i=>document.getElementById(i).value,amt=parseFloat(g("fa"));
  if(!g("fd")||!(amt>0)){alert("Please enter a date and an amount greater than zero.");return}
  S.tx.push({id:S.id++,date:g("fd"),type:g("ft"),head:g("fh"),mode:g("fm"),amt,note:g("fn")});
  save();M=g("fd").slice(0,7);render();
}
function del(id){if(confirm("Delete this entry?")){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}
function cf(){
  const rows=[];
  for(let i=1;i<=dim(M);i++){const d=M+"-"+pad(i),o=bal(d,true),c=bal(d);
    rows.push(`<tr><td>${d}</td><td>${fmt(o.b)}</td><td>${fmt(o.c)}</td><td>${fmt(tot(d,"Income",0,"Bank"))}</td><td>${fmt(tot(d,"Income",0,"Cash"))}</td><td>${fmt(tot(d,"Expense",0,"Bank"))}</td><td>${fmt(tot(d,"Expense",0,"Cash"))}</td><td>${fmt(c.b)}</td><td>${fmt(c.c)}</td></tr>`)}
  const T=(t,m)=>fmt(tot(M,t,0,m));
  const list=S.tx.filter(t=>t.date.startsWith(M)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  return monthPick()+`<div class="card"><h2>Add entry</h2><div class="row">
  <div><label>Date</label><input id="fd" type="date" value="${TODAY}"></div>
  <div><label>Type</label><select id="ft" onchange="swapCats()"><option>Income</option><option>Expense</option></select></div>
  <div><label>Head / category</label><select id="fh">${catOpts("Income")}</select></div>
  <div><label>Mode</label><select id="fm"><option>Bank</option><option>Cash</option></select></div>
  <div><label>Amount (₹)</label><input id="fa" type="number" min="0" step="0.01" inputmode="decimal"></div>
  <div><label>Note</label><input id="fn" maxlength="80"></div>
  <div><button class="btn p" onclick="addTx()">Add</button></div></div></div>
  <div class="card"><h2>Entries – ${M}</h2><div class="sc"><table><tr><th>Date</th><th>Type</th><th>Head</th><th>Mode</th><th>Amount</th><th>Note</th><th></th></tr>
  ${list.map(t=>`<tr><td>${t.date}</td><td class="${t.type==="Income"?"inc":"exp"}">${t.type}</td><td>${esc(t.head)}</td><td>${t.mode}</td><td>${fmt(t.amt)}</td><td>${esc(t.note||"")}</td><td><button class="x" onclick="del(${t.id})" title="Delete">✕</button></td></tr>`).join("")||'<tr><td colspan="7">No entries this month.</td></tr>'}</table></div></div>
  <div class="card"><h2>Cash flow statement – ${M}</h2><div class="sc"><table><tr><th>Date</th><th>Op. Bank</th><th>Op. Cash</th><th>Inc. Bank</th><th>Inc. Cash</th><th>Exp. Bank</th><th>Exp. Cash</th><th>Cl. Bank</th><th>Cl. Cash</th></tr>${rows.join("")}
  <tr><th>Total</th><th></th><th></th><th>${T("Income","Bank")}</th><th>${T("Income","Cash")}</th><th>${T("Expense","Bank")}</th><th>${T("Expense","Cash")}</th><th></th><th></th></tr></table></div></div>`;
}
function setL(k,v){S.set[k]=parseFloat(v)||0;save();render()}
function bs(){
  const c=bal(AS),inv=S.tx.filter(t=>t.type==="Expense"&&t.head===INV&&t.date<=AS).reduce((a,t)=>a+t.amt,0);
  const A=c.b+c.c+inv,L=(+S.set.loan)+(+S.set.cc)+(+S.set.ol);
  const li=(n,k)=>`<tr><td>${n}</td><td><input type="number" value="${S.set[k]}" onchange="setL('${k}',this.value)" style="max-width:140px"></td></tr>`;
  return`<div class="card"><label>As of date</label><input type="date" value="${AS}" onchange="AS=this.value||AS;render()" style="max-width:200px"></div>
  <div class="two"><div class="card sc"><h2>Assets</h2><table><tr><td>Cash at bank</td><td>${fmt(c.b)}</td></tr><tr><td>Cash in hand</td><td>${fmt(c.c)}</td></tr><tr><td>Investments – SIP/Shares (invested value)</td><td>${fmt(inv)}</td></tr><tr><th>TOTAL ASSETS</th><th>${fmt(A)}</th></tr></table></div>
  <div class="card sc"><h2>Liabilities</h2><table>${li("Loans outstanding","loan")}${li("Credit card / payables","cc")}${li("Other liabilities","ol")}<tr><th>TOTAL LIABILITIES</th><th>${fmt(L)}</th></tr></table></div></div>
  <div class="card"><div class="k">NET WORTH</div><div class="v">${fmt(A-L)}</div></div>`;
}
function settings(){
  return`<div class="card"><h2>Opening balances (before your first entry)</h2><div class="row"><div><label>Bank</label><input type="number" value="${S.set.ob}" onchange="setL('ob',this.value)"></div><div><label>Cash</label><input type="number" value="${S.set.oc}" onchange="setL('oc',this.value)"></div></div></div>
  <div class="card"><h2>Categories (comma-separated)</h2><div class="row"><div><label>Income sources</label><input id="ci" value="${esc(S.set.inc.join(", "))}"></div><div><label>Expense categories (keep “SIP/Shares” to count it as an investment)</label><input id="ce" value="${esc(S.set.exp.join(", "))}"></div><div><button class="btn p" onclick="saveCats()">Save</button></div></div></div>
  <div class="card"><h2>Backup / restore</h2><p class="k">Data is stored in this browser only. Copy the text below to back it up; paste a backup and press Restore to load it.</p><textarea id="bk" rows="5"></textarea><p><button class="btn" onclick="document.getElementById('bk').value=JSON.stringify(S);document.getElementById('bk').select()">Show backup</button> <button class="btn" onclick="restore()">Restore</button> <button class="btn" onclick="wipe()">Erase all data</button></p></div>`;
}
function saveCats(){const p=i=>document.getElementById(i).value.split(",").map(s=>s.trim()).filter(Boolean);S.set.inc=p("ci");S.set.exp=p("ce");save();render()}
function restore(){try{const p=JSON.parse(document.getElementById("bk").value);if(!Array.isArray(p.tx))throw 0;S={...S,...p,set:{...S.set,...p.set}};save();render()}catch(e){alert("That backup text is not valid.")}}
function wipe(){if(confirm("Erase all entries and settings?")){S.tx=[];S.id=1;save();render()}}
render();
</script></body></html>
